name: Feature request
description: Suggest a change or something new for Pao.
title: "Feature: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Some things are out of scope on purpose. For example, Pao never converts between currencies or adds different currencies together: see [ADR 0001](https://github.com/nonpawite/pao/blob/main/docs/adr/0001-currency-per-pocket.md).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you or your household trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered?
      description: Workarounds you use now, or other ways to solve it.
