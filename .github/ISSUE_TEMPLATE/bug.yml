name: Bug report
description: Something in Pao doesn't work as it should.
title: "Bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Don't file it here. Report it privately: https://github.com/nonpawite/pao/security/advisories/new
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include any error message you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a pocket in THB
        2. Add an entry of 120
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pao version
      description: The release you run (for example 1.0.0), or the commit if you built from source.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Pao?
      options:
        - Published image (ghcr.io/nonpawite/pao)
        - Image built from source
        - Development server (bun run dev)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari, installed to the home screen
  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: Output of `docker compose logs app` around the time of the bug. Remove anything private first.
      render: shell
