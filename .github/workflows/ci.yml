name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile's oven/bun pin is the single source of the Bun version.
      - name: Read Bun version from Dockerfile
        id: bun
        run: |
          version=$(sed -n 's/^FROM oven\/bun:\([0-9.]*\)-alpine.*/\1/p' Dockerfile | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
