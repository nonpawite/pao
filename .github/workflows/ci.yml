name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile's oven/bun pin is the single source of the Bun version.
      - name: Read Bun version from Dockerfile
        id: bun
        run: |
          version=$(sed -n 's/^FROM oven\/bun:\([0-9.]*\)-alpine.*/\1/p' Dockerfile | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Sign-in tests against Postgres
        env:
          DATABASE_URL: postgresql://tracker:tracker@127.0.0.1:5432/tracker
          BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
        run: |
          bun scripts/migrate.mjs
          bun run test:db
      - run: bun run build
