services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      # This fixed password is safe only because Postgres is reachable just from the compose
      # network (the app container) and this machine's 127.0.0.1, never from other machines.
      # To change it: run
      #   docker compose exec db psql -U tracker -c "ALTER USER tracker PASSWORD 'new-password'"
      # then put the same password here and in DATABASE_URL below, and run `docker compose up -d`.
      # (This line alone only sets the password when the database is first created.)
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # For `bun run dev` on this machine.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      retries: 10

  app:
    # Follows the newest release: `docker compose pull` brings fixes and features, and a breaking
    # release when the major version changes. Use :1 to stay on major version 1, or an exact
    # version (for example :1.0.0) to stay on one release.
    # To run your own checkout instead, see docker-compose.build.yml.
    image: ghcr.io/nonpawite/pao:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tracker:tracker@db:5432/tracker
      # The currency of each new member's personal pocket: an ISO 4217 code such as THB, USD, EUR or JPY.
      # Any pocket can switch currency later in its settings. Without this line (or with an unknown code), Pao uses USD.
      DEFAULT_CURRENCY: USD
      # "false": sign-up by invite. The first account made becomes the admin, and invites everyone
      # else from Settings. "true": anyone who can open this instance can create an account; if it is
      # reachable from the internet, strangers can sign up.
      ALLOW_SIGNUP: "false"
      # APP_TZ: your time zone, so "today" and daily limits turn over at your midnight. Use a name
      # from https://en.wikipedia.org/wiki/List_of_tz_database_time_zones, e.g. Europe/London. Unset means UTC.
      APP_TZ: UTC
      # Only behind an HTTPS reverse proxy: the public address. Leave it unset for http://<server address>:3000.
      # BETTER_AUTH_URL: https://pao.example.com
    volumes:
      # The auth secret the app creates on first start.
      - app-data:/app/data
    ports:
      # Change the left number to serve on another port.
      - "3000:3000"

volumes:
  db-data:
  app-data:
