services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      # This fixed password is safe only because Postgres is reachable just from the compose
      # network (the app container) and this machine's 127.0.0.1, never from other machines.
      # To change it: run
      #   docker compose exec db psql -U tracker -c "ALTER USER tracker PASSWORD 'new-password'"
      # then put the same password here and in DATABASE_URL below, and run `docker compose up -d`.
      # (This line alone only sets the password when the database is first created.)
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # For `bun run dev` on this machine.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      retries: 10

  app:
    # Follows major version 1: `docker compose pull` brings fixes and features, never a breaking
    # release. Pin an exact version (for example :1.0.0) to stay on one release.
    # To run your own checkout instead, see docker-compose.build.yml.
    image: ghcr.io/nonpawite/pao:1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tracker:tracker@db:5432/tracker
      # While "true", anyone who can open this instance can create an account. If it is reachable
      # from the internet, strangers can sign up: set "false" before you expose it.
      # Set to "false" once every household member has an account, then run `docker compose up -d` again.
      ALLOW_SIGNUP: "true"
      APP_TZ: Asia/Bangkok
    volumes:
      # The auth secret the app creates on first start.
      - app-data:/app/data
    ports:
      # Change the left number to serve on another port.
      - "3000:3000"

volumes:
  db-data:
  app-data:
